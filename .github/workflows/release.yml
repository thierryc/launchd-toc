name: Notarized Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag and project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          tag_core="${tag_version%%-*}"
          project_version="$(xcodebuild -project LaunchdTOC.xcodeproj -scheme LaunchdTOC -showBuildSettings | awk '/MARKETING_VERSION/ { print $3; exit }')"
          [[ "$tag_core" == "$project_version" ]]
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Create ephemeral signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/launchd-toc.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Archive universal signed application
        run: |
          xcodebuild archive \
            -project LaunchdTOC.xcodeproj \
            -scheme LaunchdTOC \
            -configuration Release \
            -archivePath build/LaunchdTOC.xcarchive \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=N9U29A4T8J \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Verify signed product
        run: |
          app_path="build/LaunchdTOC.xcarchive/Products/Applications/Launchd TOC.app"
          scripts/verify_app.sh "$app_path"
          codesign -dvvv "$app_path"

      - name: Package DMG
        run: |
          app_path="build/LaunchdTOC.xcarchive/Products/Applications/Launchd TOC.app"
          scripts/package_dmg.sh "$app_path" "$VERSION" build/release
          codesign --force \
            --sign "Developer ID Application" \
            --timestamp \
            "build/release/Launchd-TOC-${VERSION}-universal.dmg"

      - name: Notarize and staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          dmg_path="build/release/Launchd-TOC-${VERSION}-universal.dmg"
          xcrun notarytool submit "$dmg_path" \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Gatekeeper and clean-install smoke checks
        run: |
          dmg_path="build/release/Launchd-TOC-${VERSION}-universal.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
          mount_point="$(mktemp -d "$RUNNER_TEMP/launchd-toc-mount.XXXXXX")"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          installed_path="$RUNNER_TEMP/Clean Install/Launchd TOC.app"
          mkdir -p "$(dirname "$installed_path")"
          ditto "$mount_point/Launchd TOC.app" "$installed_path"
          hdiutil detach "$mount_point"
          spctl --assess --type execute --verbose=2 "$installed_path"
          scripts/verify_app.sh "$installed_path"

      - name: Generate checksum
        run: |
          cd build/release
          shasum -a 256 "Launchd-TOC-${VERSION}-universal.dmg" \
            > "Launchd-TOC-${VERSION}-universal.dmg.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          prerelease_args=()
          if [[ "$TAG_NAME" == *"-"* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            "build/release/Launchd-TOC-${VERSION}-universal.dmg" \
            "build/release/Launchd-TOC-${VERSION}-universal.dmg.sha256" \
            --generate-notes \
            --verify-tag \
            "${prerelease_args[@]}"

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${NOTARY_KEY_PATH:-}" ]]; then
            rm -f "$NOTARY_KEY_PATH"
          fi
