name: LaunchdTOC

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.3"

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: N9U29A4T8J
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ONLY_ACTIVE_ARCH: NO
    ARCHS: "$(ARCHS_STANDARD)"

targets:
  LaunchdTOC:
    type: application
    platform: macOS
    sources:
      - path: LaunchdTOC
    info:
      path: LaunchdTOC/Resources/Info.plist
      properties:
        CFBundleDisplayName: Launchd TOC
        CFBundleName: Launchd TOC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Thierry Charbonnel. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litsquare.launchdtoc
        PRODUCT_NAME: Launchd TOC
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"

  LaunchdTOCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LaunchdTOCTests
        excludes:
          - Fixtures
      - path: LaunchdTOCTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: LaunchdTOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litsquare.launchdtoc.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Launchd TOC.app/Contents/MacOS/Launchd TOC"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LaunchdTOCUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LaunchdTOCUITests
    dependencies:
      - target: LaunchdTOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litsquare.launchdtoc.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LaunchdTOC

schemes:
  LaunchdTOC:
    build:
      targets:
        LaunchdTOC: all
        LaunchdTOCTests: [test]
        LaunchdTOCUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LaunchdTOCTests
          parallelizable: true
        - name: LaunchdTOCUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
